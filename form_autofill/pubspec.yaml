name: form_autofill
description: Professional form auto-fill using Accessibility Service and OCR.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  intl: ^0.19.0
  uuid: ^4.5.1
  http: ^1.2.2
  path: ^1.9.0
  process_run: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/profiles/
